<title>国考·省考·事业编 错题本（手机版）</title>
<style>
/* iOS 添加到主屏幕提示 */
.ios-tip{display:none;background:rgba(46,107,79,.96);color:#fff;padding:12px 16px;border-radius:12px;margin-bottom:12px;font-size:14px;
  align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
.ios-tip.show{display:flex}
.ios-tip button{background:#fff;color:var(--blue);border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;flex-shrink:0}
:root{--blue:#2e6b4f;--blue2:#4d8a6a;--blue-light:#e9f2ec;--bg:#f4f8f4;--card:#fff;
  --text:#2a3430;--muted:#7f8d85;--green:#2c8a63;--red:#cf5750;--orange:#e09240;
  --border:#e0e9e1;--shadow:0 4px 14px rgba(45,90,70,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(160deg,#f7faf6,#f0f5ef 40%,#e9f0e8);
  color:var(--text);line-height:1.6;background-attachment:fixed}
.app{max-width:1100px;margin:0 auto;padding:18px 18px 46px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:23px;box-shadow:var(--shadow)}
.brand h1{font-size:21px;letter-spacing:1px}
.brand p{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;transition:.18s;color:#fff;background:var(--blue)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(46,107,79,.25)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--blue-light)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.orange{background:var(--orange)}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;background:#fff;padding:6px;border-radius:12px;box-shadow:var(--shadow)}
.tab{flex:1;min-width:108px;text-align:center;padding:10px 8px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--muted);
  background:transparent;border:none;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:600;box-shadow:0 3px 8px rgba(46,107,79,.25)}
.tab .cnt{background:rgba(255,255,255,.25);border-radius:8px;padding:0 7px;font-size:12px;min-width:20px;text-align:center}
.tab:not(.active) .cnt{background:var(--blue-light);color:var(--blue)}
.panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.panel h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2 .icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--blue-light);font-size:16px;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field label .req{color:var(--red)}
.field select,.field input[type=text],.field input[type=number],.field textarea{border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-size:14px;font-family:inherit;background:#f7faf7;color:var(--text);outline:none;transition:.15s;width:100%}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(46,107,79,.12)}
.field textarea{resize:vertical;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:5px 11px;border-radius:16px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text);transition:.12s;user-select:none}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.photo-box{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.photo-drop{width:110px;height:110px;border:2px dashed var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:var(--muted);cursor:pointer;font-size:12px;gap:4px;transition:.15s;background:#f7faf7;text-align:center}
.photo-drop:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.photo-preview{position:relative}
.photo-preview img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--border);display:block}
.photo-preview .del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:22px}
.entry{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;transition:.15s}
.entry:hover{box-shadow:var(--shadow);border-color:#cfdecf}
.entry .head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.entry .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tag{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--blue-light);color:var(--blue);font-weight:600}
.tag.src-gw{background:#fff2df;color:#c67f0e}
.tag.src-sheng{background:#e4f7ef;color:#17804f}
.tag.src-shiye{background:#f0e6ff;color:#7a3fd0}
.tag.hot{background:#ffe9e8;color:#c8352f}
.tag.mod-1{background:#eef2ff;color:#3f5bd0}
.tag.mod-2{background:#f5efff;color:#7a5bd0}
.tag.mod-3{background:#e8f6ff;color:#1f7aa0}
.tag.mod-4{background:#e8fff1;color:#1f9e6a}
.tag.mod-5{background:#fff4e3;color:#c67f0e}
.tag.mod-6{background:#ffeef0;color:#d04f6a}
.entry .question{font-size:15px;color:var(--text);margin:2px 0 4px;word-break:break-word;white-space:pre-wrap}
.entry .meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.entry .actions{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px;text-align:center}
.stat-card .num{font-size:26px;font-weight:700;color:var(--blue)}
.stat-card .num.green{color:var(--green)}
.stat-card .num.red{color:var(--red)}
.stat-card .num.orange{color:var(--orange)}
.stat-card .lbl{font-size:12px;color:var(--muted)}
.practice-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.practice-wrap .card{min-width:0}
.q-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.q-card .q-src{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap}
.q-card .q-text{font-size:16px;font-weight:600;line-height:1.7;margin-bottom:16px;white-space:pre-wrap}
.q-photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.q-photos img{max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:.13s;background:#fff}
.opt:hover{border-color:var(--blue);background:var(--blue-light)}
.opt.selected{border-color:var(--blue);background:var(--blue-light);font-weight:600}
.opt.correct{border-color:var(--green);background:#eef9f3}
.opt.wrong{border-color:var(--red);background:#fff1f0}
.opt .key{width:26px;height:26px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.opt.correct .key{background:var(--green);color:#fff}
.opt.wrong .key{background:var(--red);color:#fff}
.result-box{margin-top:6px;border-radius:12px;padding:16px;background:#f4f8f5;border:1px solid var(--border)}
.result-box .verdict{font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.result-box .verdict.ok{color:var(--green)}
.result-box .verdict.no{color:var(--red)}
.analysis{font-size:14px;color:var(--text);line-height:1.8}
.analysis b{color:var(--blue)}
.analysis .box{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:#fff;margin-top:8px}
.encourage{margin-top:14px;border-radius:12px;padding:14px;background:linear-gradient(135deg,#fff8ec,#fff3f8);border:1px dashed #f0c36b;display:flex;align-items:center;gap:14px}
.encourage img{width:80px;height:80px;object-fit:cover;border-radius:12px;box-shadow:var(--shadow);flex-shrink:0}
.encourage .txt{font-size:14px;color:#8a5b13;line-height:1.8}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress-line{height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:12px}
.progress-line .bar{height:100%;background:linear-gradient(90deg,var(--blue),#7fae93);border-radius:6px;transition:.3s}
.music-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
.music-btn.on{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filter-bar select,.filter-bar input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;font-family:inherit;outline:none}
.filter-bar select:focus{border-color:var(--blue)}
.review-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.bar-wrap{margin-bottom:14px}
.bar-wrap .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--muted)}
.bar-wrap .bar{height:10px;background:var(--border);border-radius:6px;overflow:hidden}
.bar-wrap .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7fae93);border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(20,35,28,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:560px;padding:22px;max-height:90vh;overflow:auto}
.modal-box h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.confirm-msg{font-size:15px;line-height:1.7}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.kw{color:var(--blue);background:var(--blue-light);padding:0 4px;border-radius:4px;font-size:13px}
.photo-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer}
@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .practice-wrap{grid-template-columns:1fr}
  .tabs{flex-direction:row;flex-wrap:wrap}
  .tab{min-width:calc(50% - 4px);padding:13px 8px;font-size:15px}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .btn{padding:12px 18px;font-size:15px;min-height:44px}
  .btn.small{padding:9px 14px;min-height:40px}
  .music-btn{width:46px;height:46px;font-size:20px}
  .photo-drop{width:100px;height:100px}
  .photo-preview img{width:100px;height:100px}
  .field select,.field input[type=text],.field input[type=number],.field textarea{font-size:16px;padding:11px 12px}
  .chip{padding:8px 14px;font-size:14px}
  .opt{padding:13px 14px;font-size:15px}
  .app{padding:12px 12px 40px}
  .modal-box{padding:18px}
}
@media(max-width:760px) and (max-height:500px){
  body{font-size:13px}
}
@media print{.no-print{display:none!important}.app{max-width:100%;padding:0}.panel,.entry{box-shadow:none;border:1px solid #ccc}}
#motivBar{margin:0 0 14px;padding:10px 16px;border-radius:12px;font-size:14px;color:var(--ink);
  background:rgba(46,107,79,.07);border:1px dashed var(--blue);text-align:center;transition:opacity .4s;letter-spacing:.5px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(38,51,45,.92);color:#fff;padding:11px 20px;
  border-radius:10px;font-size:14px;z-index:99;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
/* ===== 智能识别（框选 + OCR） ===== */
.crop-mask{position:fixed;inset:0;background:rgba(15,25,20,.86);z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.crop-mask.show{display:flex}
.crop-stage{position:relative;background:#111;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);width:min(94vw,780px);height:min(76vh,660px);overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
.crop-stage canvas{display:block;max-width:100%;max-height:100%}
.crop-stage .crop-box{position:absolute;border:2px solid #4cd690;background:rgba(76,214,144,.18);pointer-events:none;box-shadow:0 0 0 9999px rgba(15,25,20,.35)}
.crop-tip{color:#cfe9da;font-size:13px;margin:10px 0 6px;text-align:center}
.crop-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.ocr-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ocr-line .btn.small{min-height:34px}
.ocr-result{background:#f4f8f5;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7;word-break:break-word}
.ocr-result.ok{color:var(--green)}
.knowlink{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:16px;padding:4px 12px;font-size:13px;color:var(--blue);background:#fff;text-decoration:none;margin:4px 6px 0 0;transition:.13s}
.knowlink:hover{background:var(--blue-light);border-color:var(--blue)}
.point-chip{display:inline-block;background:var(--blue-light);color:var(--blue);border-radius:14px;padding:3px 11px;font-size:13px;margin:3px 5px 0 0;font-weight:600}
.hot-list{margin-top:10px}
.hot-item{display:flex;align-items:flex-start;gap:8px;border-bottom:1px dashed var(--border);padding:9px 2px;font-size:14px}
.hot-item .no{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.hot-item .no.top{background:linear-gradient(135deg,#e09240,#d6741e)}
.hot-item .txt{flex:1;min-width:0}
.hot-item .txt b{font-weight:600}
.hot-item .meta{font-size:12px;color:var(--muted);margin-top:2px}
@media(max-width:760px){
  .crop-mask{padding:8px}
  .crop-stage{width:96vw;height:74vh}
  .crop-actions .btn{min-height:44px;flex:1;text-align:center}
}
</style>
</head>
<body>
<div class="app">
  <div class="ios-tip" id="iosTip">📱 添加到主屏幕，用起来更像 App，还可全屏使用
    <button onclick="hideIosTip()">知道了</button>
  </div>
  <header>
    <div class="brand">
      <div class="logo">📚</div>
      <div><h1>国考·省考·事业编错题本</h1><p>错题收集 · 智能组卷 · 复盘提升</p></div>
    </div>
    <div class="top-actions no-print">
      <button class="music-btn" id="musicBtn" title="背景音乐（播放/停止）" onclick="toggleMusic()">🎵</button>
      <button class="music-btn" id="trackBtn" title="换一首轻音乐" onclick="nextTrack()">🎼</button>
    </div>
  </header>
  <div id="motivBar" class="no-print"></div>

  <nav class="tabs no-print">
    <button class="tab active" data-tab="collect" onclick="switchTab('collect')">📝 收集<span class="cnt" id="cntCollect">0</span></button>
    <button class="tab" data-tab="bank" onclick="switchTab('bank')">🗂️ 题库<span class="cnt" id="cntBank">0</span></button>
    <button class="tab" data-tab="practice" onclick="switchTab('practice')">🎯 模拟练习</button>
    <button class="tab" data-tab="review" onclick="switchTab('review')">📈 复盘统计</button>
  </nav>

  <!-- 收集 -->
    <section id="tab-collect">
    <div class="panel">
      <h2><span class="icon">📸</span> 录入新错题</h2>
      <div class="grid">
        <div class="field"><label>来源 <span class="req">*</span></label>
          <select id="f_src"><option>国考</option><option>省考</option><option>事业编</option></select></div>
        <div class="field"><label>模块 <span class="req">*</span></label>
          <select id="f_mod"><option>常识判断</option><option>言语理解</option><option>判断推理</option><option>数量关系</option><option>资料分析</option><option>申论写作</option></select></div>
        <div class="field full"><label>📝 题目照片（拍照/上传，可多张，自动压缩）</label>
          <div class="photo-box">
            <label class="photo-drop">📷<span>拍照/上传题目</span>
              <input type="file" id="f_photo" accept="image/*" multiple capture="environment" style="display:none"></label>
            <div id="photoPreviews" style="display:flex;gap:10px;flex-wrap:wrap"></div>
          </div>
        </div>
        <div class="field full" style="margin-top:6px">
          <div class="ocr-line">
            <button class="btn small orange" onclick="openOcrPick('q')">📷 框选识别题目（OCR 转文字）</button>
            <button class="btn small ghost" onclick="openOcrConfig()">⚙️ OCR 配置</button>
            <span id="ocrStatus" style="font-size:12px;color:var(--muted)"></span>
          </div>
          <div id="ocrInfo" class="ocr-result" style="display:none"></div>
        </div>
        <div class="field full"><label>题目内容（可编辑）</label><textarea id="f_q" style="min-height:88px" placeholder="OCR 识别后自动填入，可手动修改"></textarea></div>
        <div class="field full"><label>选项（每行一个，如：A. xxx）</label><textarea id="f_opts" style="min-height:70px" placeholder="OCR 识别后自动填入"></textarea></div>
        <div class="field"><label>题型</label><select id="f_kind"><option>单选</option><option>多选</option><option>判断</option><option>填空</option><option>简答</option></select></div>
        <div class="field"><label>我的错误答案</label><input id="f_wrong" placeholder="选错了的选项"></div>
      </div>
      <div style="height:1px;background:var(--border);margin:16px 0"></div>
      <div class="grid">
        <div class="field full"><label>✅ 正确答案 · 方式一：拍照框选 OCR 识别（可不用）</label>
          <div class="photo-box">
            <label class="photo-drop">📷<span>拍照/上传答案</span>
              <input type="file" id="f_ansphoto" accept="image/*" multiple capture="environment" style="display:none"></label>
            <div id="ansPhotoPreviews" style="display:flex;gap:10px;flex-wrap:wrap"></div>
          </div>
        </div>
        <div class="field full" style="margin-top:6px">
          <div class="ocr-line">
            <button class="btn small orange" onclick="openOcrPick('a')">📷 框选识别答案（OCR 转文字）</button>
            <button class="btn small ghost" onclick="openOcrConfig()">⚙️ OCR 配置</button>
            <span id="ansOcrStatus" style="font-size:12px;color:var(--muted)"></span>
          </div>
          <div id="ansOcrInfo" class="ocr-result" style="display:none"></div>
        </div>
        <div class="field full"><label>正确答案 · 方式二：手动录入（两种方式任选其一，也可先 OCR 再修改）</label><input id="f_right" placeholder="拍照 OCR 自动填入，或直接手动输入，如：B 或 6天"></div>
      </div>
      <div style="height:1px;background:var(--border);margin:16px 0"></div>
      <div class="grid">
        <div class="field full">
          <label>💡 知识点智能识别（自动匹配，无需手工录入）</label>
          <div class="ocr-line">
            <button class="btn small orange" onclick="smartKnowledge()">🧠 智能识别知识点</button>
            <span id="kwStatus" style="font-size:12px;color:var(--muted)"></span>
          </div>
          <div id="kwResult" class="ocr-result" style="display:none"></div>
          <div class="field" style="margin-top:10px"><label>手动补充知识点（可留空，自动识别为主）</label><input id="f_kw" placeholder="如：宪法基本原则（选填）"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn" onclick="saveEntry()">✅ 保存错题</button>
        <button class="btn ghost" onclick="resetCollect()">清空表单</button>
      </div>
    </div>
  </section>

  <!-- 题库 -->
  <section id="tab-bank" style="display:none">
    <div class="panel">
      <h2><span class="icon">🗂️</span> 错题库 <span style="font-size:13px;color:var(--muted);font-weight:400" id="bankCount"></span></h2>
      <div class="filter-bar no-print">
        <select id="filterSrc" onchange="renderBank()"><option value="">全部来源</option><option>国考</option><option>省考</option><option>事业编</option></select>
        <select id="filterMod" onchange="renderBank()"><option value="">全部模块</option><option>常识判断</option><option>言语理解</option><option>判断推理</option><option>数量关系</option><option>资料分析</option><option>申论写作</option></select>
        <select id="filterHot" onchange="renderBank()"><option value="">全部频率</option><option>是</option><option>否</option></select>
        <select id="filterRev" onchange="renderBank()"><option value="">全部复盘</option><option>未复盘</option><option>已复盘一次</option><option>已复盘多次</option><option>已掌握</option></select>
        <input type="text" id="filterKw" placeholder="🔍 关键词/题型" oninput="renderBank()">
        <button class="btn small orange" onclick="practiceFromBank()">🎯 练习筛选结果</button>
        <button class="btn small ghost" onclick="exportData()">💾 导出备份</button>
        <button class="btn small ghost" onclick="importData()">📥 导入备份</button>
      </div>
      <div id="bankList"></div>
    </div>
  </section>

  <!-- 练习 -->
  <section id="tab-practice" style="display:none">
    <div class="panel no-print" id="practiceSetup">
      <h2><span class="icon">🎯</span> 模拟练习设置</h2>
      <div class="grid">
        <div class="field"><label>练习来源</label>
          <select id="p_src"><option value="">全部来源</option><option>国考</option><option>省考</option><option>事业编</option></select></div>
        <div class="field"><label>练习模块</label>
          <select id="p_mod"><option value="">全部模块</option><option>常识判断</option><option>言语理解</option><option>判断推理</option><option>数量关系</option><option>资料分析</option><option>申论写作</option></select></div>
        <div class="field"><label>优先策略</label>
          <select id="p_strategy"><option value="high">高频优先</option><option value="weak">薄弱优先（未复盘/常错）</option><option value="random">随机</option></select></div>
        <div class="field"><label>题目数量</label><input type="number" id="p_count" min="1" max="20" value="5"></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn" onclick="startPractice()">开始练习</button>
        <span style="font-size:12px;color:var(--muted)">按高频或同类薄弱反复出题，答后显示答案+解题技巧</span>
      </div>
    </div>
    <div id="practiceRun" style="display:none">
      <div class="practice-wrap">
        <div class="card"><div class="q-card">
          <div class="q-src" id="pqMeta"></div>
          <div class="q-text" id="pqText"></div>
          <div id="pqPhotos" class="q-photos"></div>
          <div id="pqChoices"></div>
          <div id="pqFill" style="display:none">
            <input type="text" id="pqFillInput" placeholder="请输入你的答案" style="border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;font-size:15px;width:100%;font-family:inherit;outline:none">
          </div>
          <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
            <button class="btn green" id="pqSubmit" onclick="submitAnswer()">提交答案</button>
            <button class="btn ghost" onclick="nextQuestion(true)">下一题 ▶</button>
          </div>
          <div class="progress-line"><div class="bar" id="pqBar" style="width:0%"></div></div>
          <div style="margin-top:6px;font-size:12px;color:var(--muted)" id="pqProgress"></div>
        </div></div>
        <div class="card" id="resultCard" style="display:none"><div class="q-card"><div id="resultBox"></div></div></div>
      </div>
      <div class="ctrl no-print" style="margin-top:14px">
        <button class="btn red small" onclick="endPractice()">结束练习</button>
        <span style="font-size:13px;color:var(--muted)" id="pSummary"></span>
      </div>
    </div>
  </section>

  <!-- 复盘 -->
  <section id="tab-review" style="display:none">
    <div class="panel"><h2><span class="icon">📈</span> 复习复盘</h2><div id="reviewGrid"></div></div>
  </section>
</div>

<div class="crop-mask" id="cropMask">
  <div class="crop-stage" id="cropStage"><canvas id="cropCanvas"></canvas><div class="crop-box" id="cropBox"></div></div>
  <div class="crop-tip">按住鼠标/手指拖动，框选题目区域后点“识别”</div>
  <div class="crop-actions">
    <button class="btn green" onclick="doCropOcr()">🔍 识别框选区域</button>
    <button class="btn ghost" onclick="closeCrop()">取消</button>
  </div>
</div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="doImport(event)">

let collectPhotos=[]; /* 题目照片 */

function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=function(e){const img=new Image();img.onload=function(){
    const MAX=1000;let w=img.width,h=img.height;
    if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    cb(c.toDataURL("image/jpeg",0.7));
  };img.src=e.target.result;};
  reader.readAsDataURL(file);
}
function handlePhotoSelect(files){
  Array.from(files).forEach(f=>compressImage(f,dataUrl=>{collectPhotos.push(dataUrl);renderPhotoPreviews()}));
}
function renderPhotoPreviews(){
  const box=$("photoPreviews");box.innerHTML="";
  collectPhotos.forEach((p,i)=>{const d=document.createElement("div");d.className="photo-preview";d.style.cssText="position:relative;width:110px;height:110px";

    box.appendChild(d)});
}

const OCR_CFG_KEY="ct_ocr_cfg_v1";
let ocrCfg=null;
function loadOcrCfg(){
  if(ocrCfg)return ocrCfg;
  try{const s=localStorage.getItem(OCR_CFG_KEY);if(s)ocrCfg=JSON.parse(s)}catch(e){}
  if(!ocrCfg)ocrCfg={provider:"ocrspace",apikey:""};
  return ocrCfg;
}
function saveOcrCfg(){try{localStorage.setItem(OCR_CFG_KEY,JSON.stringify(ocrCfg))}catch(e){}}
function openOcrConfig(){
  const cfg=loadOcrCfg();
  openModal('<h3>⚙️ OCR 识别配置</h3>'
    +'<div class="field"><label>服务商</label><select id="m_provider"><option value="ocrspace">OCR.space（免费 · 支持手机浏览器直连）</option></select></div>'
    +'<div class="field" style="margin-top:10px"><label>API Key</label><input id="m_apikey" value="'+esc(cfg.apikey||"")+'" placeholder="粘贴你的 OCR.space API Key"></div>'
    +'<div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7">'
    +'注册免费 Key（1 分钟）：打开 <b>https://ocr.space/ocrapi</b>，用邮箱或 GitHub 登录即可获得，每月免费 25,000 次。<br>Key 仅保存在本机浏览器，不会上传。</div>'
    +'<div class="modal-actions"><button class="btn" onclick="saveOcrCfgUi()">保存</button><button class="btn ghost" onclick="closeModal()">取消</button></div>');
}
function saveOcrCfgUi(){
  const cfg=loadOcrCfg();
  cfg.provider=$("m_provider").value;
  cfg.apikey=$("m_apikey").value.trim();
  saveOcrCfg();toast("✅ OCR 配置已保存");closeModal();
}
async function callOcrImage(dataUrl){
  const cfg=loadOcrCfg();
  const key=(cfg.apikey||"").trim();
  if(!key){toast("请先配置 OCR 的 API Key");openOcrConfig();throw new Error("未配置 API Key，已为你打开配置窗口")}
  const url="https://api.ocr.space/parse/image";
  const form=new URLSearchParams();
  form.set("apikey",key);
  form.set("language","chs");
  form.set("base64url",dataUrl);
  form.set("isOverlayRequired","false");
  let res;
  try{res=await fetch(url,{method:"POST",body:form})}
  catch(e){throw new Error("网络请求失败，请检查网络后重试（当前需联网识别）")}
  if(!res.ok)throw new Error("OCR 服务响应异常（HTTP "+res.status+"）");
  const j=await res.json();
  if(j.IsErroredOnProcessing){throw new Error("OCR 识别失败："+String(j.ErrorMessage||"").slice(0,120))}
  const t=(j.ParsedResults||[]).map(r=>r.ParsedText||"").join("\n");
  if(!t.trim())throw new Error("未识别到文字，请重新框选或换张更清晰的照片");
  return t.trim();
}

function openCropEditor(idx){
  closeModal();
  cropState={photoIdx:idx,img:null,ctx:null,down:false,sx:0,sy:0,cx:0,cy:0,w:0,h:0};
  $("cropMask").classList.add("show");
  const img=new Image();
  img.onload=function(){
    const c=$("cropCanvas");
    const box=$("cropStage").getBoundingClientRect();
    const maxW=Math.max(box.width-20,260),maxH=Math.max(box.height-20,260);
    let w=img.width,h=img.height;
    const s=Math.min(maxW/w,maxH/h,1);
    w=Math.round(w*s);h=Math.round(h*s);
    c.width=w;c.height=h;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#232323";ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    cropState.ctx=ctx;cropState.w=w;cropState.h=h;
    $("cropBox").style.display="none";
  };
  img.src=(ocrTarget==='a'?ansPhotos:collectPhotos)[idx];
}
function cropPos(e){
  const c=$("cropCanvas"),r=c.getBoundingClientRect();
  const t=e.touches&&e.touches[0]?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function cropStart(e){
  if(!cropState)return;e.preventDefault();
  const p=cropPos(e);
  cropState.down=true;cropState.sx=p.x;cropState.sy=p.y;cropState.cx=p.x;cropState.cy=p.y;
  drawCropBox();
}
function cropMove(e){
  if(!cropState||!cropState.down)return;e.preventDefault();
  const p=cropPos(e);
  cropState.cx=p.x;cropState.cy=p.y;drawCropBox();
}
function cropUp(){if(cropState)cropState.down=false}
function drawCropBox(){
  const st=cropState,box=$("cropBox");
  let x=Math.min(st.sx,st.cx),y=Math.min(st.sy,st.cy),w=Math.abs(st.cx-st.sx),h=Math.abs(st.cy-st.sy);
  box.style.display=(w<6||h<6)?"none":"block";
  box.style.left=Math.max(0,x)+"px";box.style.top=Math.max(0,y)+"px";
  box.style.width=Math.min(w,st.w)+"px";box.style.height=Math.min(h,st.h)+"px";
}
function doCropOcr(){
  const st=cropState;
  if(!st||!st.ctx){toast("请先在照片上框选区域");return}
  let x=Math.min(st.sx,st.cx),y=Math.min(st.sy,st.cy),w=Math.abs(st.cx-st.sx),h=Math.abs(st.cy-st.sy);
  if(w<6||h<6){toast("框选区域太小，请重新框选");return}
  x=Math.max(0,x);y=Math.max(0,y);w=Math.min(w,st.w-x);h=Math.min(h,st.h-y);
  const out=document.createElement("canvas");
  out.width=Math.round(w);out.height=Math.round(h);
  out.getContext("2d").drawImage($("cropCanvas"),x,y,w,h,0,0,w,h);
  const dataUrl=out.toDataURL("image/jpeg",0.92);
  closeCrop();
  runOcr(dataUrl);
}
async function runOcr(dataUrl){
  const st=$("ocrStatus"),info=$("ocrInfo");
  const ast=$("ansOcrStatus"),ainfo=$("ansOcrInfo");
  st.textContent="⏳ 正在识别…";info.style.display="none";
  ast.textContent="⏳ 正在识别…";ainfo.style.display="none";
  try{
    const text=await callOcrImage(dataUrl);
    if(ocrTarget==='a'){
      $("f_right").value=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).join(" ");
      toast("✅ 已识别正确答案，请核对");
      ainfo.style.display="block";ainfo.className="ocr-result ok";
      ainfo.innerHTML="<b>识别到的答案（可编辑上方正确答案）：</b><br>"+esc(text).replace(/\n/g,"<br>").slice(0,400);
      ast.textContent="";
    }else{
      const r=analyzeOcrText(text);
      $("f_q").value=r.body;
      $("f_opts").value=r.opts.join("\n");
      $("f_kind").value=r.kind;
      if(r.opts.length)toast("✅ 已识别题目与 "+r.opts.length+" 个选项，请核对并填答案");
      else toast("✅ 已识别，请核对题目与答案");
      info.style.display="block";info.className="ocr-result ok";
      info.innerHTML="<b>识别结果（可编辑上方题目/选项）：</b><br>"+esc(text).replace(/\n/g,"<br>").slice(0,800);
      st.textContent="";
    }
  }catch(e){
    if(ocrTarget==='a'){
      ainfo.style.display="block";ainfo.className="ocr-result";
      ainfo.innerHTML="✖ "+esc(e.message||String(e));
      ast.textContent="";
    }else{
      info.style.display="block";info.className="ocr-result";
      info.innerHTML="✖ "+esc(e.message||String(e));
      st.textContent="";
    }
  }
}
function closeCrop(){$("cropMask").classList.remove("show");cropState=null}
/* 解析 OCR 文本 → 题目 + 选项 + 题型 */
function analyzeOcrText(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const optRe=/^([A-H])[.、．:：)）\s]\s*(.+)$/;
  let splitAt=-1;
  for(let i=0;i<lines.length;i++){if(lines[i].match(optRe)){splitAt=i;break}}
  const body=lines.slice(0,splitAt<0?lines.length:splitAt).join("\n");
  const opts=[];
  if(splitAt>=0){
    for(let i=splitAt;i<lines.length;i++){const m=lines[i].match(optRe);if(m)opts.push(m[1]+". "+m[2])}
  }
  let kind="单选";
  const all=body+" "+(opts.join(" "));
  if(!opts.length){
    if(/[（(]\s*[)）]|__|＿_/.test(all)||/[A-Z][.、]\s*$/.test(body))kind="填空";
    else if(/判断|是否正确|对错|对的|错的/.test(all))kind="判断";
    else kind="简答";
  }else{
    if(/多选|多项|不定项|哪些|全选/.test(all))kind="多选";
    else if(/判断|是否正确|对错|√|×/.test(all))kind="判断";
  }
  return {body:body,opts:opts,kind:kind};
}

function smartKnowledge(){
  const t=(($("f_q").value||"")+" "+($("f_opts").value||"")+" "+($("f_right").value||""))+" ";
  const kwInput=($("f_kw").value||"").trim();
  const hits=[];
  if(kwInput)hits.push(kwInput);
  for(const item of KNOWLEDGE_MAP){
    for(const k of item.k){if(k && t.indexOf(k)>=0){hits.push(item.p);break}}
  }
  const uniq=[];hits.forEach(x=>{if(x&&uniq.indexOf(x)<0)uniq.push(x)});
  const st=$("kwStatus"),box=$("kwResult");
  if(uniq.length){
    const kw=uniq.join("、");
    box.style.display="block";box.className="ocr-result ok";
    box.innerHTML="<b>🧠 识别到的知识点：</b>"+kw.split("、").map(x=>'<span class="point-chip">'+esc(x)+'</span>').join("")+"<br><span style='font-size:12px;color:var(--muted)'>点击下方链接可学习（需联网）</span><br>"+knowLinksHTML(kw);
    st.textContent="✅ 已识别 "+uniq.length+" 个知识点";
    return {list:uniq,kw:uniq[0]};
  }else{
    box.style.display="block";box.className="ocr-result";
    box.innerHTML="未自动匹配到知识点。请补充题目/答案后重试，或在上方手动填写关键词。";
    st.textContent="";
    return {list:[],kw:""};
  }
}

function modCls(mod){const m={常识判断:"mod-1",言语理解:"mod-2",判断推理:"mod-3",数量关系:"mod-4",资料分析:"mod-5",申论写作:"mod-6"};return m[mod]||"mod-1"}
function srcCls(src){return src==="国考"?"src-gw":src==="省考"?"src-sheng":"src-shiye"}
function tagsHTML(e){
  let h='<span class="tag '+srcCls(e.src)+'">'+e.src+'</span>';
  h+='<span class="tag '+modCls(e.mod)+'">'+e.mod+'</span>';
  if(e.type)h+='<span class="tag">'+esc(e.type)+'</span>';
  if(e.hot==="是")h+='<span class="tag hot">🔥高频</span>';
  (e.reasons||[]).forEach(r=>h+='<span class="tag">'+esc(r)+'</span>');
  return h;
}
/* ================= 题库 ================= */
function currentFilters(){
  return{src:$("filterSrc").value,mod:$("filterMod").value,hot:$("filterHot").value,rev:$("filterRev").value,kw:$("filterKw").value.trim().toLowerCase()};
}
function filteredEntries(f){
  f=f||currentFilters();
  return DB.entries.filter(e=>{
    if(f.src&&e.src!==f.src)return false;
    if(f.mod&&e.mod!==f.mod)return false;
    if(f.hot&&e.hot!==f.hot)return false;
    if(f.rev&&e.review!==f.rev)return false;
    if(f.kw){const hay=(e.kw+" "+e.type+" "+e.q+" "+e.point).toLowerCase();if(hay.indexOf(f.kw)<0)return false}
    return true;
  }).sort((a,b)=>b.id-a.id);
}

  const list=filteredEntries();
  $("bankCount").textContent="共 "+list.length+" 题";
  const box=$("bankList");

    let h='<div class="entry"><div class="head"><div class="tags">'+tagsHTML(e)+'</div><div style="font-size:12px;color:var(--muted)">'+esc(e.created.slice(0,10))+'</div></div>';

function parseChoices(text){
  const lines=text.split(/\r?\n/);

  return out;

let audioCtx=null,musicTimers=[],musicTrack=0,musicBus=null,musicSpace=null;
const C4=261.63;
/* 音符用 [半音数(相对C4), 拍数]；bass 为 [半音数(相对C2), 拍数]；chord 为 [和弦半音组, 拍数]，null=休止 */
const list1=[[0,1],[4,1],[7,1],[12,1],[null,1],[9,1],[12,1],[16,2],[null,1],[14,1],[12,1],[9,1],[12,2],[null,1],

const bass1=[[-12,4],[-8,4],[-5,4],[-7,4],[-12,4],[-8,4],[-5,4],[-3,4]];
const chord1=[[[0,4,7],4],[[0,4,7],4],[[-3,0,4],4],[[-5,-1,2],4],[[0,4,7],4],[[0,4,7],4],[[-3,0,4],4],[[-5,-1,2],4]];
const list2=[[7,1.5],[9,0.5],[12,2],[null,1],[11,1],[9,1],[7,2],[null,1],
             [4,1.5],[7,0.5],[9,2],[null,1],[7,1],[4,1],[2,2],[null,1],
             [4,1],[7,1],[9,1],[12,1],[14,1],[12,2],[null,1],[9,1],[7,1],[4,1],[2,1],[0,3],[null,2]];
const bass2=[[-9,4],[-5,4],[-8,4],[-10,4],[-9,4],[-5,4],[-8,4],[-6,4]];
const chord2=[[[-5,-1,2],4],[[-1,2,5],4],[[-8,-4,0],4],[[-10,-6,-3],4],[[-5,-1,2],4],[[-1,2,5],4],[[-8,-4,0],4],[[-6,-2,1],4]];
const list3=[[4,1],[7,1],[11,1],[14,1],[null,1],[12,1],[11,1],[7,2],[null,1],
             [2,1],[4,1],[7,1],[11,1],[null,1],[9,1],[7,1],[4,2],[null,1],
             [0,1],[2,1],[4,1],[7,1],[9,1],[11,1],[12,2],[null,1],[7,1],[4,1],[2,1],[0,3],[null,2]];

const chord3=[[[-12,-8,-5],4],[[-8,-4,-1],4],[[-12,-8,-5],4],[[-5,-1,2],4],[[-7,-3,0],4],[[-3,1,4],4],[[-5,-1,2],4],[[-8,-4,-1],4]];

/* 柔和钢琴音色：基音+暖倍频，慢起音，长尾，接全局混响 */
function makeMusicBus(ctx){
  const bus=ctx.createGain();bus.gain.value=0.9;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-24;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=0.01;comp.release.value=0.3;
  bus.connect(comp);
  /* 简易混响：多个延迟叠加 */
  const space=ctx.createGain();space.gain.value=0.5;
  const delays=[0.16,0.27,0.38],fbGains=[0.28,0.22,0.18];
  const mIn=ctx.createGain(),mOut=ctx.createGain();
  mIn.connect(bus);bus.connect(comp);
  mIn.connect(mOut);
  delays.forEach((d,i)=>{
    const dl=ctx.createDelay(1);dl.delayTime.value=d;
    const fb=ctx.createGain();fb.gain.value=fbGains[i];
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;
    const wet=ctx.createGain();wet.gain.value=0.5;
    mIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(mOut);
  });
  mOut.gain.value=1.0;
  comp.connect(ctx.destination);mOut.connect(ctx.destination);
  bus.gain.value=0.55;
  return {bus:bus,wet:space};
}
function pianoNote(ctx,freq,dur,time,vol){
  vol=vol||0.2;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,time);
  g.gain.linearRampToValueAtTime(vol,time+0.04);
  g.gain.exponentialRampToValueAtTime(vol*0.45,time+dur*0.45);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
  const o1=ctx.createOscillator();o1.type="triangle";o1.frequency.value=freq;
  const o2=ctx.createOscillator();o2.type="sine";o2.frequency.value=freq*2;const g2=ctx.createGain();g2.gain.value=0.22;
  const o3=ctx.createOscillator();o3.type="sine";o3.frequency.value=freq*3.01;const g3=ctx.createGain();g3.gain.value=0.07;
  o1.connect(g);o2.connect(g2);g2.connect(g);o3.connect(g3);g3.connect(g);
  g.connect(musicBus);
  o1.start(time);o1.stop(time+dur+0.1);o2.start(time);o2.stop(time+dur+0.1);o3.start(time);o3.stop(time+dur+0.1);
}
function trackName(){return "《"+SONGS[musicTrack].name+"》"}
function startMusic(){
  stopMusic(true);
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume&&audioCtx.resume();
  const mb=makeMusicBus(audioCtx);musicBus=mb.bus;musicSpace=mb.wet;
  const song=SONGS[musicTrack],beat=60/song.bpm,base=audioCtx.currentTime+0.15;
  let idx=0,bIdx=0,cIdx=0,t=0,bt=0,ct=0;
  function tick(){
    if(!audioCtx)return;
    const horizon=audioCtx.currentTime+0.8;
    let guard=0;
    while(base+t<horizon&&guard<160){
      const pr=song.melody[idx],n=pr[0],b=pr[1];
      if(n!==null)pianoNote(audioCtx,C4*Math.pow(2,n/12),b*beat*1.35,base+t,0.22);
      t+=b*beat;idx++;
      if(idx>=song.melody.length){idx=0;t+=2*beat}
      guard++;
    }
    guard=0;
    while(base+bt<horizon&&guard<80){
      const pb=song.bass[bIdx],nb=pb[0],bb=pb[1];
      if(nb!==null)pianoNote(audioCtx,C4/2*Math.pow(2,nb/12),bb*beat*1.6,base+bt,0.13);
      bt+=bb*beat;bIdx++;
      if(bIdx>=song.bass.length){bIdx=0;bt=t}
      guard++;
    }
    guard=0;
    while(base+ct<horizon&&guard<80){
      const pc=song.chord[cIdx],notes=pc[0],bc=pc[1];
      notes.forEach(n2=>{pianoNote(audioCtx,C4*Math.pow(2,n2/12),bc*beat*1.2,base+ct,0.055)});
      ct+=bc*beat;cIdx++;
      if(cIdx>=song.chord.length){cIdx=0;ct=t}
      guard++;
    }
    musicTimers.push(setTimeout(tick,200));
  }
  tick();
  $("musicBtn").classList.add("on");$("musicBtn").title="正在播放："+trackName()+"（点击停止）";
  toast("🎵 正在播放："+trackName());
}
function stopMusic(silent){
  musicTimers.forEach(t=>clearTimeout(t));musicTimers=[];
  if(audioCtx){try{audioCtx.close()}catch(e){}audioCtx=null;musicBus=null;musicSpace=null}
  if(!silent){$("musicBtn").classList.remove("on");$("musicBtn").title="背景音乐（点击播放）"}
}
function nextTrack(){
  musicTrack=(musicTrack+1)%SONGS.length;
  startMusic();
}
